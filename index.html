<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AJIONE | Creator Partnerships</title>
    <meta
      name="description"
      content="AJIONE connects ambitious brands with high-fit creators through curated, data-informed partnerships."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <main class="site">
      <section class="hero" id="main" aria-label="Creator partnerships">
        <div class="hero__backdrop" aria-hidden="true"></div>
        <div class="hero__grain" aria-hidden="true"></div>

        <header class="nav" aria-label="Main navigation">
          <a class="nav__brand" href="/" aria-label="AJIONE home">
            <img src="./assets/ajione-logo.png" alt="AJIONE" />

          <nav class="nav__links" aria-label="Primary">
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#work">Our Work</a>
            <a href="#insights">Insights</a>
          </nav>

        <div class="hero__content">
          <p class="hero__kicker">Creator growth studio</p>

          <h1>
            <span>Creator</span>
            <span>partnerships.</span>
            <span class="hero__mixed-line"><em>that drive</em> growth.</span>
          </h1>

          <div class="hero__rule" aria-hidden="true"></div>

          <p class="hero__copy">
            We connect ambitious brands with creators who move culture, shape

          </p>

          <a class="button button--primary" href="#partner">
            <span>Start a Partnership</span>

          </a>
        </div>
      </section>
